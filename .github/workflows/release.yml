name: Release

# Tag vX.Y.Z → GitHub release carrying the production SPA bundle as a tarball.
# The bundle is built with same-origin defaults (/api/v1 and /ws), so it can be
# unpacked into any web root that proxies those paths to the backend — see the
# deploy compose and host server configs in the tracedown-core-backend repo.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    # Upstream-only: forks never release.
    if: github.repository == 'tracedown/tracedown-core-frontend'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package dist
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          tar -czf "tracedown-core-frontend-$TAG-dist.tar.gz" -C dist .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Tracedown Core Frontend $GITHUB_REF_NAME" \
            --notes "Production SPA bundle. Unpack into a web root and serve with the host web server; the app calls same-origin \`/api/v1\` and \`/ws\`, which the host server proxies to the backend." \
            tracedown-core-frontend-*-dist.tar.gz
