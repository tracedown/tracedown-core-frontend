name: Release

# Version-bump-driven and CI-gated: runs after the CI workflow succeeds on a
# main push, and publishes only when the version in package.json has no
# release yet.
# Merging a PR that bumps the version IS the release trigger — the workflow
# creates the vX.Y.Z tag and the GitHub release itself.
#
# The artifact is the production SPA bundle as a tarball, built with
# same-origin defaults (/api/v1 and /ws) — unpack into any web root that
# proxies those paths to the backend (see tracedown-core-backend's
# docker/deploy/).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    # Upstream-only: forks never release.
    # Runs only after the CI run for this main push succeeded — a release
    # can never ship from an untested commit.
    if: >-
      github.repository == 'tracedown/tracedown-core-frontend' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists — nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      - name: Package dist
        if: steps.check.outputs.exists == 'false'
        run: tar -czf "tracedown-core-frontend-${{ steps.version.outputs.version }}-dist.tar.gz" -C dist .

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "Tracedown Core Frontend ${{ steps.version.outputs.tag }}" \
            --notes "Production SPA bundle. Unpack into a web root and serve with the host web server; the app calls same-origin \`/api/v1\` and \`/ws\`, which the host server proxies to the backend." \
            tracedown-core-frontend-*-dist.tar.gz
