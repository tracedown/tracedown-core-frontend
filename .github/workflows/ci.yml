name: CI

on:
  pull_request:
    branches:
      - main
    # 'edited' fires on PR title/body changes, so removing a 'WIP:' prefix
    # re-triggers the checks without needing a new push.
    types: [opened, synchronize, reopened, edited]

jobs:
  # Pre-filter: skipped when the PR title starts with 'WIP:'. Every other job
  # needs it, so a skipped gate cascades.
  wip-gate:
    name: WIP gate
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.pull_request.title, 'WIP:') }}
    steps:
      - name: Not WIP
        run: echo "Running checks."

  # Detects what changed so the build self-skips on docs-only PRs.
  changed-paths:
    name: Detect changed paths
    needs: [wip-gate]
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          CODE=$(git diff --name-only "$BASE"...HEAD -- .github/workflows/ src/ public/ index.html package.json package-lock.json vite.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json eslint.config.ts .env.production .env.development)
          if [ -n "$CODE" ]; then
            echo "Code changes detected (build will run):"; echo "$CODE"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "No app/config changes — build skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Lint, type-check & build
    needs: [wip-gate, changed-paths]
    if: ${{ needs.changed-paths.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # `npm run build` runs eslint --fix, vue-tsc --noEmit, and the Vite
      # production build in sequence — the full quality gate in one script.
      - name: Build
        run: npm run build
