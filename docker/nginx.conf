# Dashboard nginx: serves the SPA and reverse-proxies API + WebSocket to the
# backend services on the shared `tracedown-net` network. Upstreams are resolved
# per-request via Docker's embedded DNS (the `set $var` + resolver pattern), so
# this container starts even if a backend service isn't up yet.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;

    # API gateway
    location /api/ {
        set $gateway http://tracedown-gateway:20714;
        proxy_pass $gateway$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (realtime-service)
    location /ws {
        set $realtime http://tracedown-realtime:20870;
        proxy_pass $realtime/ws$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA fallback — let vue-router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
